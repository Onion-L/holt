name: Cert debug

# One-shot diagnostic for the failing `security import` in release.yml.
# Prints only non-secret fingerprints of the decoded P12 (length, file type,
# leading ASN.1 header bytes, parse result). Safe to delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - name: Inspect the certificate secret bytes
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "secret length: ${#APPLE_CERTIFICATE_P12}"
          CERT_PATH="$(mktemp)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode >"$CERT_PATH"
          echo "decoded bytes: $(wc -c <"$CERT_PATH")"
          file "$CERT_PATH"
          head -c 8 "$CERT_PATH" | xxd
          echo "--- openssl parse:"
          openssl pkcs12 -info -in "$CERT_PATH" \
            -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -passout "pass:x" \
            </dev/null 2>&1 | head -6
          echo "--- security import:"
          KEYCHAIN="holt-debug.keychain"
          security create-keychain -p debug "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" 2>&1 | head -2
          security find-identity -v -p codesigning "$KEYCHAIN" | head -3
