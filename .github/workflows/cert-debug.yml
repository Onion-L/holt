name: Cert debug

# One-shot diagnostic for the certificate import in release.yml. The P12
# route is dead on macos-26 runners (security import rejects the legacy
# PBE containers Apple's own `security export` still writes), so the
# release path now imports a PEM key and PEM certificate separately.
# Safe to delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: macos-latest

    steps:
      - name: Inspect the PEM import path
        env:
          APPLE_CERT_PEM: ${{ secrets.APPLE_CERT_PEM }}
          APPLE_KEY_PEM: ${{ secrets.APPLE_KEY_PEM }}
        run: |
          KEYCHAIN="holt-debug.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          KEY_PATH="$(mktemp)"; CERT_PATH="$(mktemp)"
          printf '%s' "$APPLE_KEY_PEM" | base64 --decode >"$KEY_PATH"
          printf '%s' "$APPLE_CERT_PEM" | base64 --decode >"$CERT_PATH"
          echo "key bytes: $(wc -c <"$KEY_PATH"), cert bytes: $(wc -c <"$CERT_PATH")"
          head -1 "$KEY_PATH"; head -1 "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$KEY_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$CERT_PATH" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$KEY_PATH" "$CERT_PATH"
