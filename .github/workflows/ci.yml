name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One job per desktop platform: the engine's Windows/Linux branches
    # (path spellings, noreplace renames, watcher backends) only execute
    # where they are the host, so the macOS run alone cannot catch them.
    # fail-fast stays off — a Windows-only failure must not mask the
    # other platforms' results.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # sccache caches per-rustc-call by content hash, so the third_party gpui
      # crates (path deps outside the workspace, which rust-cache evicts)
      # stop recompiling on every run.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # gpui's Linux link-time C libraries: fontconfig and freetype plus
      # the x11 client stack (xcb, xkbcommon, xkbcommon-x11) — the 22.04
      # release runners carry the x11 set preinstalled, the 24.04 CI
      # image does not. The wayland/vulkan backends still load at runtime
      # via dlopen, so the test suite needs no display.
      - name: Install gpui build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: sccache stats
        if: always()
        run: sccache --show-stats
