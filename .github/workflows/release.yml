name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The gate verifies the tag and opens a draft release; the six
  # per-arch build jobs upload their assets into it, and `publish` flips
  # it live only when every arch landed — a failed platform never ships
  # a partial release. Retry a failed run with "Re-run all jobs": the
  # gate consumes the leftover draft, and a single-job re-run would find
  # no release to upload into.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $WORKSPACE_VERSION" >&2
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A draft for this tag is the leftover of a failed run — ours to
            # consume; a published release is not.
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
              echo "deleting the draft left by the failed run of this tag"
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "::error::release $GITHUB_REF_NAME already exists" >&2
              exit 1
            fi
          fi

      - name: Open draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft --title "Holt $VERSION" --generate-notes

  # Third-party actions are SHA-pinned: the macOS jobs import the Developer
  # ID key and the notary credentials, so a re-pointed upstream tag must
  # never execute here with them (issue #8). The refs each SHA resolved
  # from ride in the trailing comments — bump deliberately, after
  # reviewing the diff.
  build-macos-arm64:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # sccache caches per-rustc-call by content hash, so the third_party
      # gpui crates (path deps outside the workspace, which rust-cache
      # evicts) stop recompiling on every run.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-01
        with:
          targets: aarch64-apple-darwin

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Import signing certificate
        env:
          APPLE_CERT_PEM: ${{ secrets.APPLE_CERT_PEM }}
          APPLE_KEY_PEM: ${{ secrets.APPLE_KEY_PEM }}
        run: |
          # The P12 route is dead on macos-26 runners (security import rejects
          # the legacy PBE containers), so the key and certificate ride as
          # separate PEMs and import individually.
          KEYCHAIN="holt-build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          KEY_PATH="$(mktemp)"
          CERT_PATH="$(mktemp)"
          printf '%s' "$APPLE_KEY_PEM" | base64 --decode >"$KEY_PATH"
          printf '%s' "$APPLE_CERT_PEM" | base64 --decode >"$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$KEY_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$CERT_PATH" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$KEY_PATH" "$CERT_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$(mktemp)"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode >"$KEY_PATH"
          xcrun notarytool store-credentials holt-notary-ci \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Build, sign, and notarize DMG
        env:
          NOTARY_PROFILE: holt-notary-ci
        run: scripts/build-dmg.sh --target aarch64-apple-darwin

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "target/aarch64-apple-darwin/release/Holt-$VERSION-arm64.dmg"

  build-macos-x64:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-01
        with:
          targets: x86_64-apple-darwin

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Import signing certificate
        env:
          APPLE_CERT_PEM: ${{ secrets.APPLE_CERT_PEM }}
          APPLE_KEY_PEM: ${{ secrets.APPLE_KEY_PEM }}
        run: |
          # The P12 route is dead on macos-26 runners (security import rejects
          # the legacy PBE containers), so the key and certificate ride as
          # separate PEMs and import individually.
          KEYCHAIN="holt-build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          KEY_PATH="$(mktemp)"
          CERT_PATH="$(mktemp)"
          printf '%s' "$APPLE_KEY_PEM" | base64 --decode >"$KEY_PATH"
          printf '%s' "$APPLE_CERT_PEM" | base64 --decode >"$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$KEY_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$CERT_PATH" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$KEY_PATH" "$CERT_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$(mktemp)"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode >"$KEY_PATH"
          xcrun notarytool store-credentials holt-notary-ci \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Build, sign, and notarize DMG
        env:
          NOTARY_PROFILE: holt-notary-ci
        run: scripts/build-dmg.sh --target x86_64-apple-darwin

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "target/x86_64-apple-darwin/release/Holt-$VERSION-x64.dmg"

  build-windows-x64:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-01

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Release builds are GUI-subsystem with the icon embedded by
      # apps/holt/build.rs; there is no code-signing certificate yet, so
      # the exe ships unsigned in a plain zip plus a per-user setup.
      - name: Build holt.exe
        run: cargo build --release -p holt

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          # holt-release.marker names a directory the Windows self-updater
          # may swap into (crates/engine/src/update_platform.rs); it rides
          # at the zip root beside the exe, which is exactly the layout
          # the updater unpacks. Its content is informational — presence
          # is the whole test.
          $version | Set-Content -NoNewline holt-release.marker
          Compress-Archive -Path target/release/holt.exe, holt-release.marker -DestinationPath "Holt-$version-x64-win.zip"

      # The setup is the recommended install (scripts/holt-setup.iss); the
      # choco version is pinned and bumped deliberately, the same posture
      # as the SHA-pinned actions above. choco shims iscc onto PATH, so a
      # later step invokes it by name.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y

      - name: Build setup installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          iscc /DVersion=$version /DArch=x64 scripts\holt-setup.iss

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "Holt-$VERSION-x64-win.zip" \
            "Holt-$VERSION-x64-setup.exe"

  build-windows-arm64:
    needs: gate
    # The arm image hosts an aarch64-pc-windows-msvc toolchain, so the
    # build is native — no cross-compilation to configure.
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-01

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Same shape as the x64 job: unsigned GUI-subsystem exe in a zip
      # plus a per-user setup — though the setup here is best-effort (see
      # the Inno Setup step below).
      - name: Build holt.exe
        run: cargo build --release -p holt

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          # Same marker, same purpose as the x64 job's zip.
          $version | Set-Content -NoNewline holt-release.marker
          Compress-Archive -Path target/release/holt.exe, holt-release.marker -DestinationPath "Holt-$version-arm64-win.zip"

      # Inno Setup's choco package carries x86 binaries that must run on
      # this arm image through emulation; when the install cannot happen
      # the release simply carries no -arm64-setup.exe — the zip below
      # still ships (it is the ARM64 install path), and the manifest and
      # the download page cover only the assets that exist. Only the
      # install is tolerated to miss: a successful install whose compile
      # then fails still fails the job.
      - name: Install Inno Setup
        id: inno
        continue-on-error: true
        run: choco install innosetup --version=6.7.1 -y

      - name: Build setup installer
        if: steps.inno.outcome == 'success'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          iscc /DVersion=$version /DArch=arm64 scripts\holt-setup.iss

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          # The setup is optional on this arch (Inno Setup step above);
          # the zip is the release's mandatory ARM64 asset.
          assets=("Holt-$VERSION-arm64-win.zip")
          if [[ -f "Holt-$VERSION-arm64-setup.exe" ]]; then
            assets+=("Holt-$VERSION-arm64-setup.exe")
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${assets[@]}"

  build-linux-x64:
    needs: gate
    # 22.04 rather than latest on purpose: the binary links against the
    # build image's glibc (2.35), and the older baseline runs on more
    # distros. When the image retires, rebase deliberately and accept the
    # newer glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gpui's Linux link-time C libraries: fontconfig and freetype plus
      # the x11 client stack (xcb, xkbcommon, xkbcommon-x11). The
      # wayland/vulkan backends load at runtime via dlopen.
      - name: Install gpui build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev imagemagick \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-01

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and package AppImage
        run: scripts/build-appimage.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "target/release/Holt-$VERSION-x64.AppImage"

  build-linux-arm64:
    needs: gate
    # Same glibc-2.35 baseline rationale as the x64 job; the arm image
    # carries the same toolset (cmake/clang for aws-lc-sys).
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gpui build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev imagemagick \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable, 2026-10-01

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The script detects the host arch and produces the arm64 AppImage.
      - name: Build and package AppImage
        run: scripts/build-appimage.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "target/release/Holt-$VERSION-arm64.AppImage"

  publish:
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The self-updater's digest source: every Holt-* asset that actually
      # landed (releases may miss one — the ARM64 setup is best-effort),
      # keyed by exact file name, which is how the engine looks a digest
      # up. The manifest itself matches neither the pattern nor any
      # download-page suffix, so it never digests or shadows itself.
      # Uploaded before the flip below so a published release always
      # carries its manifest; --clobber keeps a re-run of this job alone
      # idempotent.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir manifest-work
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir manifest-work --pattern 'Holt-*'
          artifacts='{}'
          for asset in manifest-work/Holt-*; do
            digest="$(sha256sum "$asset" | cut -d' ' -f1)"
            artifacts="$(jq --arg name "$(basename "$asset")" --arg digest "$digest" \
              '.[$name] = $digest' <<<"$artifacts")"
          done
          jq -n --arg version "$VERSION" --argjson artifacts "$artifacts" \
            '{version: $version, artifacts: $artifacts}' > manifest-work/manifest.json
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --clobber manifest-work/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver pre-release tag (anything with a `-`, e.g.
          # v0.7.0-alpha.1) publishes WITHOUT flipping latest: GitHub's
          # releases/latest API excludes prereleases, so the stable download
          # page keeps serving the last stable release and the alpha reaches
          # only people who click into the releases list deliberately.
          if [[ "$GITHUB_REF_NAME" == *"-"* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  # Keep a failed attempt from leaving its draft release behind.
  cleanup:
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64]
    if: failure() || cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
