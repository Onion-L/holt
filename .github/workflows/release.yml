name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $WORKSPACE_VERSION" >&2
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi

      - name: Test workspace
        run: cargo test --workspace

      - name: Import signing certificate
        env:
          APPLE_CERT_PEM: ${{ secrets.APPLE_CERT_PEM }}
          APPLE_KEY_PEM: ${{ secrets.APPLE_KEY_PEM }}
        run: |
          # The P12 route is dead on macos-26 runners (security import rejects
          # the legacy PBE containers), so the key and certificate ride as
          # separate PEMs and import individually.
          KEYCHAIN="holt-build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          KEY_PATH="$(mktemp)"
          CERT_PATH="$(mktemp)"
          printf '%s' "$APPLE_KEY_PEM" | base64 --decode >"$KEY_PATH"
          printf '%s' "$APPLE_CERT_PEM" | base64 --decode >"$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$KEY_PATH" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$CERT_PATH" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$KEY_PATH" "$CERT_PATH"

      - name: Store notarytool credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$(mktemp)"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode >"$KEY_PATH"
          xcrun notarytool store-credentials holt-notary-ci \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Build, sign, and notarize DMGs
        env:
          NOTARY_PROFILE: holt-notary-ci
        run: |
          scripts/build-dmg.sh --target aarch64-apple-darwin
          scripts/build-dmg.sh --target x86_64-apple-darwin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "target/aarch64-apple-darwin/release/Holt-$VERSION-arm64.dmg" \
            "target/x86_64-apple-darwin/release/Holt-$VERSION-x64.dmg" \
            --title "Holt $VERSION" \
            --generate-notes
