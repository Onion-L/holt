[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/proto",
    "crates/doc",
    "crates/engine",
    "crates/rpc",
    "crates/ui",
    "crates/syntax",
    "crates/core",
    "apps/holt",
    "apps/holt-runner",
]
# The third-party gpui fork keeps its own (trimmed) workspace root.
exclude = ["third_party/gpui"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "GPL-3.0"
publish = false

[workspace.dependencies]
holt-proto = { path = "crates/proto" }
holt-doc = { path = "crates/doc" }
holt-engine = { path = "crates/engine" }
holt-rpc = { path = "crates/rpc" }
holt-ui = { path = "crates/ui" }
holt-syntax = { path = "crates/syntax" }
holt-theme = { path = "crates/theme" }
holt-core = { path = "crates/core" }

# CRDT
loro = "1.13"

gpui = { path = "third_party/gpui/crates/gpui" }
gpui_platform = { path = "third_party/gpui/crates/gpui_platform", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { path = "third_party/gpui/crates/gpui_tokio" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator for the binaries: returns freed pages to the OS. System
# malloc (macOS libmalloc especially) retains the churn high-water mark as
# permanent RSS - measured as the top residency cause in docs/memory-plan.md.
mimalloc = "0.1"
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
notify = "7"
# The engine's git backend (ADR-git2-as-the-git-backend). Engine-only dependency: all git2
# access lives in holt-engine's `git` module.
git2 = "0.21"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
# In-process mermaid rendering (pure Rust parse/layout/SVG). ELK layout
# (EPL-2.0) deliberately not enabled; diagram features mirror the rendered
# whitelist in crates/ui/src/markdown/mermaid.rs (`SUPPORTED_PREFIXES`).
merman = { version = "0.9.0", default-features = false, features = [
    "svg",
    "layout-cytoscape",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-class",
    "diagram-state",
    "diagram-er",
    "diagram-gantt",
    "diagram-pie",
    "diagram-git-graph",
    "diagram-mindmap",
    "diagram-timeline",
    "diagram-quadrant-chart",
    "diagram-xychart",
    "diagram-journey",
] }
unicode-segmentation = "1"
fontdb = "0.23"
ttf-parser = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ignore = "0.4"
# The content-search stack for the agent-facing `grep` API (ADR-in-process-ripgrep-for-content-search), using
# ripgrep's own crates in process — no dependency on a system `rg` binary.
aho-corasick = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
nucleo-matcher = "0.3"
# Interface strings (ADR-ui-strings-live-in-a-compile-time-catalog): the one
# i18n crate proven inside GPUI (gpui-component ships the same version), with
# `sys-locale` — already in the build tree through cosmic-text — resolving the
# follow-the-OS default. UI-only dependencies: the catalog lives in holt-ui.
rust-i18n = "4.2"
sys-locale = "0.3"

[profile.release]
# Thin LTO buys most of fat LTO's size/speed win at a fraction of the link
# time; strip debug symbols.
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# holt-core is edited in-tree; full debuginfo on its 63.5k lines inflates
# incremental artifacts for no debugger gain. Line tables keep backtraces
# readable.
[profile.dev.package.holt-core]
debug = "line-tables-only"
