[package]
name = "pi-core-rs"
version = "0.84.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Standalone Rust port of @earendil-works/pi-agent-core, pi-ai, and pi-telemetry v0.84.4"
repository = "https://github.com/earendil-works/pi"
publish = false

[lib]
name = "pi_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bytes = "1"
regex = "1"
getrandom = "0.3"
httpdate = "1"
url = "2"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json", "gzip"] }
sha2 = "0.11.0"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
hmac = "0.13"
crc32fast = "1"
libc = "0.2"
unicode-normalization = "0.1"
serde_yaml = "0.9"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tungstenite = "0.30.0"
zstd = "0.13.3"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util"] }
