[dependencies]
holt-proto.workspace = true
holt-doc.workspace = true
holt-rpc.workspace = true
pi-core-rs.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
libc.workspace = true
portable-pty.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
git2.workspace = true
sha2.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true
aho-corasick.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
notify.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
tiktoken-rs = "0.7"
reqwest.workspace = true
htmd = "0.5"
# The MCP client (ADR-0034): official SDK, client role only — stdio
# child transport plus Streamable HTTP. No server role, no macros, no
# OAuth. rmcp 3.x speaks reqwest 0.13 while holt's own HTTP surface is
# 0.12, so the renamed dep supplies rmcp's client (feature-unified with
# rustls through rmcp's `reqwest` feature).
rmcp = { version = "3.4", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }

# System-trash deletion (ticket 07): the same objc2-foundation the vendored
# gpui already carries, so the lockfile gains nothing. NSFileManager's
# trashItemAtURL is synchronous and reports failures — no nil-handler
# fire-and-forget, and never a permanent-delete fallback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "alloc",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[dev-dependencies]
png = "0.18"
tempfile.workspace = true
git2.workspace = true
# Process-liveness probes in the MCP lifecycle tests (kill(pid, 0)).
libc.workspace = true
# Paused-clock tests of the retry backoff.
tokio = { workspace = true, features = ["test-util"] }
