_version: 2
settings_general_appearance:
  language:
    group_title:
      zh-CN: 语言
    group_description:
      zh-CN: 仅本设备生效，立即应用；已打开的卡片与提示在下次构建时更新。
    row_title:
      zh-CN: 界面语言
    row_description:
      zh-CN: 跟随系统语言，或固定一种。
    follow_system:
      zh-CN: 跟随系统
  general:
    title:
      zh-CN: 通用
    subtitle:
      zh-CN: 语言、通知、自动聊天标题，以及内置工具的密钥。
    instruction_placeholder:
      zh-CN: 随首条提示一同发送的指令
    titles:
      title_model:
        zh-CN: 标题模型
      title_model_description:
        zh-CN: 选择一个已配置提供商的模型；禁用则保留回退标题。
      custom_style:
        zh-CN: 自定义标题风格
      custom_style_description:
        zh-CN: 自动标题的风格说明——语言、语气、命名习惯。核心命名规则已内置。
      notes_label:
        zh-CN: 标题风格说明
      restore_default:
        zh-CN: 恢复默认
      unsaved:
        zh-CN: 未保存的修改
      save:
        zh-CN: 保存
    groups:
      titles_title:
        zh-CN: 自动聊天标题
      titles_description:
        zh-CN: 新聊天会先保留首行标题，随后一次发往该模型的后台请求可以替换它。手动重命名始终优先。
      verifier_title:
        zh-CN: 目标校验器
      verifier_description:
        zh-CN: 评判每个目标循环 Turn 的模型。换一个——最好跨提供商——的模型能发现工作模型遗漏的问题。以最低推理强度校验；未设置或未配置时回退到各聊天自己的模型。
      verifier_row_title:
        zh-CN: 校验模型
      verifier_row_description:
        zh-CN: 在每个目标循环 Turn 结束后以最低推理强度运行一次。
      no_providers:
        zh-CN: 暂无已配置的提供商——添加提供商密钥后才能选择校验模型
    notifications:
      title:
        zh-CN: 通知
      description:
        zh-CN: 仅本设备生效。仅在没有 Holt 窗口处于活动状态时显示横幅。
      completion:
        zh-CN: 任务完成通知
      completion_description:
        zh-CN: 后台 Turn 成功或失败时显示系统横幅。
      sound:
        zh-CN: 播放声音
      sound_description:
        zh-CN: 每条横幅附带播放系统通知音。
    model_rows:
      disabled:
        zh-CN: 已禁用
      disabled_description:
        zh-CN: 保留首行标题——不发起后台命名请求
      chat_model:
        zh-CN: 聊天模型
      chat_model_description:
        zh-CN: 每个聊天的目标循环用自身模型校验
      not_in_catalog:
        zh-CN: 不在当前提供商目录中
      unavailable:
        zh-CN: 不可用
    errors:
      titles_unavailable:
        zh-CN: 标题设置不可用——引擎尚不支持
      verifier_unavailable:
        zh-CN: 目标校验设置不可用——引擎尚不支持
  web_search:
    title:
      zh-CN: 网页搜索
    description:
      zh-CN: 让 Agent 搜索网页。Exa 无需密钥；其余服务使用你自己的 API 密钥。
