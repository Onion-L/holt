_version: 2
settings_general_appearance:
  language:
    group_title:
      en-US: Language
    group_description:
      en-US: Device-local. Applies immediately; open cards and notices pick it up when they rebuild.
    row_title:
      en-US: Interface language
    row_description:
      en-US: Follow the system language, or pin one.
    follow_system:
      en-US: Follow system
  general:
    title:
      en-US: General
    subtitle:
      en-US: Language, notifications, automatic chat titles, and keys for built-in tools.
    instruction_placeholder:
      en-US: Instruction sent with the first prompt
    titles:
      title_model:
        en-US: Title model
      title_model_description:
        en-US: Choose a configured provider model. Disabled keeps the fallback title.
      custom_style:
        en-US: Custom title style
      custom_style_description:
        en-US: Style notes for automatic titles — language, tone, naming conventions. The core naming rules are built in.
      notes_label:
        en-US: Title style notes
      restore_default:
        en-US: Restore default
      unsaved:
        en-US: Unsaved changes
      save:
        en-US: Save
    groups:
      titles_title:
        en-US: Automatic chat titles
      titles_description:
        en-US: A new chat keeps its first-line title immediately, then one background request to this model can replace it. Your manual renames always win.
      verifier_title:
        en-US: Goal verifier
      verifier_description:
        en-US: The model that judges each goal loop's turns. A different — ideally cross-provider — model catches what the working model misses. Verified at the lowest reasoning level; falls back to each chat's model when unset or unconfigured.
      verifier_row_title:
        en-US: Verifier model
      verifier_row_description:
        en-US: Runs once after each settled goal-loop turn, at minimal reasoning.
      no_providers:
        en-US: No configured providers — add a provider key to pick a verifier model
    notifications:
      title:
        en-US: Notifications
      description:
        en-US: Device-local. Banners appear only while no Holt window is active.
      completion:
        en-US: Completion notifications
      completion_description:
        en-US: Show a system banner when a background Turn succeeds or fails.
      sound:
        en-US: Play sound
      sound_description:
        en-US: Play the system notification sound with each banner.
    updates:
      title:
        en-US: Updates
      description:
        en-US: Holt checks for new releases in the background; check on demand below, or download from the releases page.
      row_title:
        en-US: Version
      check:
        en-US: Check for Updates
      checking:
        en-US: Checking…
    model_rows:
      disabled:
        en-US: Disabled
      disabled_description:
        en-US: Keep the first-line title — no background naming request
      chat_model:
        en-US: Chat's model
      chat_model_description:
        en-US: Each chat's goal loop verifies on its own model
      not_in_catalog:
        en-US: Not in the current provider catalog
      unavailable:
        en-US: unavailable
    errors:
      titles_unavailable:
        en-US: Title settings aren't available — the engine doesn't support them yet
      verifier_unavailable:
        en-US: Goal verifier settings aren't available — the engine doesn't support them yet
  web_search:
    title:
      en-US: Web search
    description:
      en-US: Lets the agent search the web. Exa works without a key; the others use your own API key.
    service_row_title:
      en-US: Search service
    service_row_description:
      en-US: The service the agent searches with.
    api_key_row_title:
