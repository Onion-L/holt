[package]
name = "holt-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holt-proto.workspace = true
similar.workspace = true
holt-doc.workspace = true
holt-engine.workspace = true
holt-rpc.workspace = true
holt-syntax.workspace = true
holt-theme.workspace = true
gpui.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
merman.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-segmentation.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tempfile.workspace = true
tracing.workspace = true
sha2.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Two tests drive a REAL engine end to end — the usage status line
# (scripted provider → RPC → decoded frame) and the Settings fetch dialog
# (loopback vendor → probe → SaveModelRecord) — so the crate rides the
# engine's own fixture by path, included once in `lib.rs`
# (`crate::engine_fixture`). These are what that fixture module needs to
# compile inside this crate's test build.
holt-core.workspace = true
tokio-util.workspace = true
# The fixture module's git helpers (`common::init_repo`) name git2 types.
git2.workspace = true
