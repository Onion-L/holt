[package]
name = "holt-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
holt-proto.workspace = true
similar.workspace = true
holt-doc.workspace = true
holt-engine.workspace = true
holt-rpc.workspace = true
holt-syntax.workspace = true
holt-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
merman.workspace = true
# Not imported directly: pin the transitive merman-* family so merman
# 0.8.0-alpha.5 compiles (see the note in the root Cargo.toml).
merman-core.workspace = true
merman-render.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-segmentation.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tempfile.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The usage status-line test drives a REAL engine end to end (scripted
# provider → RPC → decoded frame), so it rides the engine's own fixture by
# path (`chat_usage::tests::engine_fixture`). These two are what that fixture
# module needs to compile inside this crate's test build.
pi-core-rs.workspace = true
tokio-util.workspace = true
