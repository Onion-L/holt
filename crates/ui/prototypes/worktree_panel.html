<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Holt — Worktree 面板原型</title>
<style>
  :root {
    /* 参考图：暖灰纸面、细线时间轴、单一洋红强调色 */
    --bg:#e9e7e4; --shell:#f2f1ef; --card:#f7f6f4; --raised:#fdfdfc; --well:#e6e4e0;
    --text:#1d1c1b; --muted:#8f8a84; --faint:#a8a39d; --line:#d3cfca;
    --accent:#f0167f; --danger:#d9483b; --warning:#c58a16; --success:#2f9a68; --info:#4f7fd6;
    --border:rgba(40,30,20,.08); --border-strong:rgba(40,30,20,.14);
    --hover:rgba(40,30,20,.045); --active:rgba(40,30,20,.06);
    --shadow:0 1px 2px rgba(40,30,20,.08), 0 2px 8px rgba(40,30,20,.06);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; padding:18px; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  .app { flex:1; display:flex; min-width:0; background:var(--shell); border-radius:22px; overflow:hidden;
    border:1px solid rgba(255,255,255,.8); box-shadow:0 0 0 1px var(--border), 0 12px 40px rgba(40,30,20,.08); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
  .mono { font-family:var(--mono); font-size:12px; }
  .muted { color:var(--muted); } .faint { color:var(--faint); }

  /* shell */
  .rail { width:72px; padding:22px 0; display:flex; flex-direction:column; align-items:center; gap:10px;
    border-right:1px solid var(--border); }
  .rail i { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; color:var(--muted); }
  .rail i svg { width:22px; height:22px; }
  .rail i.on { background:var(--raised); color:var(--text); box-shadow:var(--shadow); }
  .rail .sep { height:18px; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { min-height:72px; flex-wrap:wrap; padding:0 26px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); }
  header h1 { font-size:20px; font-weight:500; margin:0; letter-spacing:-.01em; }
  .base { color:var(--muted); font-size:13px; }
  .grow { flex:1; }
  .seg { display:flex; padding:3px; background:var(--well); border-radius:11px; }
  .seg button { padding:5px 14px; border-radius:8px; color:var(--muted); white-space:nowrap; }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed=true] { background:var(--raised); color:var(--text); box-shadow:var(--shadow); }
  .seg button b { font-weight:400; color:var(--faint); margin-left:5px; font-size:12px; }
  .btn { white-space:nowrap; padding:6px 13px; border-radius:9px; color:var(--text); }
  .btn:hover { background:var(--hover); }
  .btn.ghost { color:var(--muted); } .btn.ghost:hover { color:var(--text); }
  .btn.solid { background:var(--raised); box-shadow:var(--shadow); }
  .btn.primary { background:var(--text); color:var(--raised); font-weight:500; }
  .btn.primary:hover { background:#000; }
  .btn.danger { background:var(--danger); color:#fff; }
  .btn[disabled] { opacity:.35; cursor:not-allowed; }
  .body { flex:1; display:flex; min-height:0; }

  /* timeline list：分组头在外轨，worktree 在内轨，用曲线连接 */
  .list { width:clamp(340px, 46%, 560px); flex-shrink:0; border-right:1px solid var(--border); overflow:auto; padding:18px 14px 40px 22px; }
  .tree { position:relative; }
  .tree > svg { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .row { position:relative; height:54px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center;
    padding-right:12px; border-radius:12px; transition:opacity .15s; }
  .row.wt { cursor:pointer; }
  .row.wt:hover { background:var(--hover); }
  .row[aria-selected=true] { background:var(--active); }
  .row.dim { opacity:.35; }
  .row.mc { color:var(--faint); font-size:12.5px; }
  .row.mc .msg { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.mc .sha { font-family:var(--mono); font-size:11.5px; margin-right:8px; }
  .tag { display:inline-block; font:500 11px/1 var(--mono); padding:3px 6px; border-radius:6px; background:var(--text); color:var(--raised); margin-right:8px; vertical-align:1px; }
  .legend { display:flex; gap:14px; padding:0 0 14px 4px; font-size:12px; color:var(--faint); }
  .g-path { fill:none; stroke:var(--line); stroke-width:1.5; }
  .g-path.merged { stroke-dasharray:3 4; }
  .g-path.on { stroke:var(--accent); stroke-width:1.75; filter:drop-shadow(0 0 3px rgba(240,22,127,.45)); }
  .g-trunk { fill:none; stroke:var(--muted); stroke-width:2; }
  .g-dot { fill:var(--faint); }
  .g-dot.main { fill:var(--muted); }
  .g-dot.head { fill:var(--text); }
  .g-dot.hollow { fill:var(--shell); stroke:var(--faint); stroke-width:1.5; }
  .g-dot.ring { fill:var(--shell); stroke:var(--faint); stroke-width:1.5; animation:pulse 1.4s infinite; }
  .g-dot.on { fill:var(--accent); stroke:none; filter:drop-shadow(0 0 4px rgba(240,22,127,.6)); animation:none; }
  .title { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .15s; }
  .row:hover .title, .row[aria-selected=true] .title { color:var(--text); }
  .sub { display:flex; gap:10px; overflow:hidden; margin-top:1px; color:var(--faint); font-size:12px; white-space:nowrap; }
  .sub .add { color:var(--success); } .sub .del { color:var(--danger); }
  .status { display:inline-flex; align-items:center; gap:6px; font-size:12px; white-space:nowrap; color:var(--muted); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--c, currentColor); }
  .s-running { --c:var(--accent); } .s-running .dot { animation:pulse 1.2s infinite; }
  .s-dirty { --c:var(--warning); } .s-ready { --c:var(--success); } .s-conflict { --c:var(--danger); }
  .s-behind { --c:var(--info); } .s-merged { --c:var(--faint); } .s-idle { --c:var(--line); }
  @keyframes pulse { 50% { opacity:.3; } }
  .unused-tdot { position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; background:var(--faint); }
  .head .tdot { background:var(--muted); }
  .tdot.ring { background:var(--shell); box-shadow:inset 0 0 0 1.5px var(--faint); animation:pulse 1.4s infinite; }
  .tdot.on { background:var(--accent); box-shadow:0 0 0 3px rgba(240,22,127,.18), 0 0 8px rgba(240,22,127,.5); animation:none; }

  /* detail */
  .detail { flex:1; display:flex; flex-direction:column; min-width:0; }
  .dhead { padding:22px 26px 14px; }
  .dhead h2 { margin:0 0 6px; font-size:18px; font-weight:500; letter-spacing:-.01em; }
  .meta { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); font-size:13px; align-items:center; }
  .meta a { color:var(--muted); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  .meta a:hover { color:var(--text); }
  .kv a { color:var(--text); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
  .dhead .seg { margin-top:16px; width:max-content; max-width:100%; flex-wrap:wrap; }
  .pane { flex:1; overflow:auto; padding:4px 26px 20px; }
  .card { border-radius:14px; background:var(--raised); box-shadow:0 0 0 1px var(--border); margin-bottom:14px; }
  .card > .hd { flex-wrap:wrap; padding:12px 16px 4px; display:flex; align-items:center; gap:8px; font-weight:500; }
  .card > .hd .note { font-weight:400; color:var(--faint); font-size:13px; }
  .card > .bd { padding:8px 16px 14px; }
  .kv { display:grid; grid-template-columns:90px minmax(0,1fr); word-break:break-all; gap:8px 14px; font-size:13px; margin:0; }
  .kv dt { color:var(--faint); } .kv dd { margin:0; }
  .check { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--border); }
  .check:first-child { border-top:0; }
  .ok { color:var(--success); } .bad { color:var(--danger); } .pend { color:var(--faint); }
  .commit { display:grid; grid-template-columns:70px 1fr auto; gap:10px; padding:9px 0; border-top:1px solid var(--border); }
  .commit:first-child { border-top:0; }
  .file { display:flex; gap:10px; align-items:center; padding:8px 16px; border-top:1px solid var(--border); }
  .file:first-child { border-top:0; }
  .file .p { flex:1; }
  .letter { width:16px; text-align:center; font-weight:600; font-family:var(--mono); font-size:11px; }
  pre.diff { margin:0; padding:6px 0 12px; font:12px/1.6 var(--mono); overflow:auto; }
  pre.diff span { display:block; padding:0 16px; white-space:pre; }
  pre.diff .a { background:rgba(47,154,104,.09); color:#1f6e4a; }
  pre.diff .d { background:rgba(217,72,59,.08); color:#a3342a; }
  pre.diff .h { color:var(--faint); }
  .finding { padding:10px 16px; border-top:1px solid var(--border); display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start; }
  .finding:first-child { border-top:0; }
  .sev { font-size:11px; padding:1px 7px; border-radius:6px; background:var(--well); color:var(--muted); }
  .sev.mid { background:rgba(197,138,22,.14); color:#8a5f0c; }
  .empty { color:var(--faint); text-align:center; padding:32px 0; }
  .alert { box-shadow:0 0 0 1px rgba(217,72,59,.25); }

  /* merge footer */
  .footer { border-top:1px solid var(--border); padding:14px 26px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .hint { font-size:13px; }

  /* modal */
  .scrim { position:fixed; inset:0; background:rgba(40,30,20,.18); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; }
  .scrim.open { display:flex; }
  .modal { width:600px; max-height:80vh; display:flex; flex-direction:column; background:var(--shell);
    border-radius:18px; box-shadow:0 0 0 1px var(--border), 0 24px 60px rgba(40,30,20,.18); }
  .modal .hd { padding:18px 20px 6px; font-size:16px; font-weight:500; }
  .modal .bd { padding:10px 20px; overflow:auto; }
  .modal .ft { padding:14px 20px 18px; display:flex; justify-content:flex-end; gap:8px; }
  textarea { width:100%; min-height:76px; background:var(--raised); color:var(--text); border:0; box-shadow:0 0 0 1px var(--border-strong);
    border-radius:10px; padding:10px; font:12px/1.55 var(--mono); resize:vertical; }
  textarea:focus { outline:none; box-shadow:0 0 0 2px var(--accent); }
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--raised);
    padding:8px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; font-size:13px; }
  .toast.show { opacity:1; }
  .proto-note { position:fixed; right:28px; bottom:26px; font-size:11px; color:var(--faint); }
</style>
</head>
<body>
<div class="app">
<nav class="rail" aria-label="导航">

</nav>

<script>

const WT = [

    ahead:0, behind:0, add:438, del:584, files:12, uncommitted:0, age:"今天 01:07", path:"~/.holt/worktrees/c_5a77",
    mergedAs:"0929012", checks:[["test","ok","1m 39s"]], review:null },
];
// main 上的 commit；ROWS 是从新到旧的显示顺序（worktree 行 = 它的分支头）
const MAIN = {

let HEAD = "15df296";

];

-    todo!()

let sel = "b", filter = "all", tab = "overview", mode = "squash";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const FILTERS = [["all","全部"],["active","进行中"],["ready","可合并"],["blocked","需处理"],["merged","已合并"]];
const inFilter = w => filter === "all"
  || (filter === "active" && ["running","dirty","idle"].includes(w.status))

// 图：main 是 x=TRUNK 的主干；每个 worktree 占一条泳道，从 fork 点分出，已合并的在 merge 点汇回主干
const RH = 54, TRUNK = 16, LANE = 22;
function layout() {
  const idx = {}; ROWS.forEach((r, i) => idx[r] = i);
  const spans = WT.map(w => ({ w, tip: idx["w:" + w.id], top: w.merge ? idx["m:" + w.merge] : idx["w:" + w.id], fork: idx["m:" + w.fork] }))
    .filter(x => x.tip !== undefined).sort((a, b) => a.top - b.top);
  const laneEnd = []; // 每条泳道被占用到哪一行
  spans.forEach(x => {
    let l = laneEnd.findIndex(end => end < x.top);
    if (l < 0) { l = laneEnd.length; laneEnd.push(0); }
    laneEnd[l] = x.fork; x.lane = l + 1;
  });
  return { spans, lanes: laneEnd.length };

  const y = i => i * RH + RH / 2, xl = l => TRUNK + l * LANE, h = RH / 2;

  let paths = "", selPath = "", dots = "";

    const x = xl(lane), yf = y(fork);
    let d = w.merge
      ? `M${TRUNK} ${y(top)} C${TRUNK} ${y(top) + h}, ${x} ${y(top) + h}, ${x} ${y(top) + RH} L${x} ${yf - RH}`
      : `M${x} ${y(tip)} L${x} ${yf - RH}`;
    d += ` C${x} ${yf - h}, ${TRUNK} ${yf - h}, ${TRUNK} ${yf}`;
    const on = w.id === sel;
    const el = `<path class="g-path ${w.merge ? "merged" : ""} ${on ? "on" : ""}" d="${d}"/>`;
    on ? selPath = el : paths += el;
    const cls = on ? "on" : w.status === "running" ? "ring" : w.status === "merged" ? "hollow" : "";
    dots += `<circle class="g-dot ${cls}" cx="${x}" cy="${y(tip)}" r="${on ? 5 : 4.5}"/>`;
  });
  mainRows.forEach(i => {
    const head = ROWS[i] === "m:" + HEAD;
    dots += `<circle class="g-dot ${head ? "head" : "main"}" cx="${TRUNK}" cy="${y(i)}" r="${head ? 5 : 3.5}"/>`;
  });
  const y0 = y(mainRows[0]), y1 = ROWS.length * RH + 20;
  const trunk = `<path class="g-trunk" d="M${TRUNK} ${y0} L${TRUNK} ${y1}"/>`;
  const fade = `<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="85%" stop-color="#000"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></linearGradient>`;
  const w = xl(lanes) + 14;
  return { width: w, svg: `<svg width="${w}" height="${y1}" aria-hidden="true"><defs>${fade}</defs>${trunk}${paths}${selPath}${dots}</svg>` };
}

function renderChips() {
  $("chips").innerHTML = FILTERS.map(([k, l]) => {
    const n = WT.filter(w => { const f = filter; filter = k; const r = inFilter(w); filter = f; return r; }).length;
    return `<button aria-pressed="${filter === k}" data-f="${k}">${l}<b>${n}</b></button>`;
  }).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
}

function renderList() {
  const g = graph(layout());
  const open = WT.filter(w => w.status !== "merged").length;
  const html = ROWS.map(r => {
    const [k, id] = r.split(":");
    if (k === "m") return `<div class="row mc" style="padding-left:${g.width}px">
      <div class="msg">${id === HEAD ? `<span class="tag">main</span>` : ""}<span class="sha">${id}</span>${esc(MAIN[id])}</div><span></span></div>`;
    const w = WT.find(x => x.id === id), st = STATUS[w.status];
    return `<div class="row wt ${inFilter(w) ? "" : "dim"}" role="option" tabindex="0" aria-selected="${w.id === sel}" data-id="${w.id}" style="padding-left:${g.width}px">
      <div style="min-width:0">
        <div class="title">${esc(w.title)}</div>
        <div class="sub"><span class="mono">${esc(w.branch)}</span>
          ${w.status === "merged" ? `<span>合并为 ${w.mergedAs || w.merge}</span>` : `<span>↑${w.ahead}${w.behind ? ` ↓${w.behind}` : ""}</span>`}
          <span><span class="add">+${w.add}</span> <span class="del">−${w.del}</span></span>
          <span>${w.age}</span></div>
      </div>
      <span class="status ${st.cls}"><span class="dot"></span>${st.label}</span>
    </div>`;
  }).join("");
  $("list").innerHTML = `<div class="legend"><span>${WT.length} 个 worktree</span><span>${open} 个未合并</span></div>
    <div class="tree">${g.svg}${html}</div>`;
  $("list").querySelectorAll(".row.wt").forEach(r => {
    r.onclick = () => { sel = r.dataset.id; tab = "overview"; render(); };
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); r.click(); } };
  });
}

function checksCard(w) {
  const body = w.checks
    ? w.checks.map(([n, s, t]) => `<div class="check"><span class="${s}">${s === "ok" ? "✓" : s === "bad" ? "✕" : "…"}</span>
        <span class="mono grow">${n}</span><span class="faint">${t}</span></div>`).join("")
    : `<div class="faint">没跑过。检查是可选的，命令列表来自 <span class="mono">.holt/checks.toml</span>（没有就不显示）。</div>`;
  return `<div class="card"><div class="hd">检查 <span class="note">在 main + 本分支的临时 worktree 中运行</span>
    <span class="grow"></span><button class="btn solid" data-act="checks">${w.checks ? "重新运行" : "运行"}</button></div><div class="bd">${body}</div></div>`;
}
function reviewCard(w, full) {
  const r = w.review;
  const body = r
    ? r.findings.map(([sev, loc, msg], i) => `<div class="finding">
        <span class="sev ${sev === "中" ? "mid" : ""}">${sev}</span>
        <div><div class="mono">${esc(loc)}</div><div class="muted">${esc(msg)}</div></div>
        ${w.chat ? `<button class="btn solid" data-act="send" data-i="${i}">发回 chat</button>` : ""}</div>`).join("")
    : `<div class="bd faint">还没审查。审查是按需的，不会拦住合并。</div>`;
  return `<div class="card"><div class="hd">审查 ${r ? `<span class="note">${esc(r.by)} · ${esc(r.verdict)}</span>` : ""}
    <span class="grow"></span>
    <button class="btn solid" data-act="review" data-p="bugbot">bugbot</button>
    <button class="btn solid" data-act="review" data-p="security-review">security</button>
    <button class="btn solid" data-act="review" data-p="custom">自定义…</button></div>${r ? `<div>${body}</div>` : body}</div>`;
}

function pane(w) {
  if (tab === "commits") {
    if (!w.ahead) return `<div class="empty">没有领先 main 的 commit${w.uncommitted ? `，但有 ${w.uncommitted} 个未提交的文件` : ""}</div>`;
    return `<div class="card"><div class="bd">${COMMITS.slice(0, w.ahead).map(([s, m, t]) =>
      `<div class="commit"><span class="mono faint">${s}</span><span>${esc(m)}</span><span class="faint">${t}</span></div>`).join("")}</div></div>`;
  }
  if (tab === "files") {
    return `<div class="card"><div class="hd">相对 merge-base 的改动 <span class="note">${w.files} 个文件</span></div>
      <div>${FILES.slice(0, w.files).map(([l, p, a, d]) => `<div class="file">
        <span class="letter ${l === "A" ? "ok" : "s-dirty"}">${l}</span><span class="p mono">${p}</span>
        <span class="ok mono">+${a}</span><span class="bad mono">−${d}</span></div>`).join("")}</div></div>
      <div class="card"><div class="hd mono">${FILES[0][1]}</div>
      <pre class="diff">${DIFF.split("\n").map(l => `<span class="${l[0] === "+" ? "a" : l[0] === "-" ? "d" : l[0] === "@" ? "h" : ""}">${esc(l)}</span>`).join("")}</pre></div>`;
  }
  if (tab === "review") return reviewCard(w, true) + checksCard(w);
  // overview
  const conflict = w.conflicts ? `<div class="card alert"><div class="hd bad">合并到 main 会冲突</div>
    <div class="bd">${w.conflicts.map(p => `<div class="mono" style="padding:3px 0">${p}</div>`).join("")}
    <div class="faint" style="margin-top:8px">Holt 不在这里做三方合并。可以交给作者 chat 去 rebase，或在编辑器里自己解决。</div></div></div>` : "";
  return conflict + `<div class="card"><div class="bd"><dl class="kv">
      <dt>分支</dt><dd class="mono">${esc(w.branch)}</dd>
      <dt>路径</dt><dd class="mono">${esc(w.path)}</dd>
      <dt>相对 main</dt><dd>领先 ${w.ahead} · 落后 ${w.behind}</dd>
      <dt>改动</dt><dd><span class="ok">+${w.add}</span> <span class="bad">−${w.del}</span> · ${w.files} 个文件${w.uncommitted ? ` · <span class="s-dirty">${w.uncommitted} 个未提交</span>` : ""}</dd>
      <dt>Chat</dt><dd>${w.chat ? `<a href="#">${esc(w.chat)}</a>${w.turn ? ` · <span class="s-running">${esc(w.turn)}</span>` : ""}` : `<span class="faint">无（手动导入的 worktree）</span>`}</dd>
      ${w.mergedAs ? `<dt>合并为</dt><dd class="mono">${w.mergedAs}</dd>` : ""}
    </dl></div></div>` + checksCard(w) + reviewCard(w);
}
// 合并栏：按 git 状态给出能做的事；从不硬性要求先审查或先跑检查
function footer(w) {
  const seg = `<div class="seg" role="group" aria-label="合并方式">
    <button aria-pressed="${mode === "squash"}" data-m="squash">Squash</button>
    <button aria-pressed="${mode === "ff"}" data-m="ff" ${w.behind ? 'title="落后 main，无法 fast-forward"' : ""}>Fast-forward</button></div>`;
  const warn = [];
  if (!w.checks) warn.push("未跑检查");
  else if (w.checks.some(c => c[1] === "bad")) warn.push("检查未通过");
  if (!w.review) warn.push("未审查");
  const note = warn.length ? `<span class="hint s-dirty">${warn.join(" · ")}（不拦截）</span>` : `<span class="hint ok">检查与审查都已通过</span>`;
  switch (w.status) {
    case "running": return `<span class="hint muted">agent 仍在工作，结束后再合并</span><span class="grow"></span><button class="btn primary" disabled>合并到 main</button>`;
    case "dirty": return `<span class="hint s-dirty">${w.uncommitted} 个文件未提交，合并只包含已提交的内容</span><span class="grow"></span>
      <button class="btn solid" data-act="commit">提交改动…</button><button class="btn primary" disabled>合并到 main</button>`;
    case "conflict": return `<span class="hint bad">${w.conflicts.length} 个文件冲突</span><span class="grow"></span>
      <button class="btn solid" data-act="editor">在编辑器打开</button>
      ${w.chat ? `<button class="btn primary" data-act="resolve">交给 chat 解决</button>` : ""}`;
    case "merged": return `<span class="hint muted">已作为 <span class="mono">${w.mergedAs}</span> 合进 main</span><span class="grow"></span>
      <button class="btn solid" data-act="remove">删除 worktree 和分支…</button>`;
    case "idle": return `<span class="hint muted">相对 main 没有改动</span><span class="grow"></span><button class="btn solid" data-act="remove">删除 worktree…</button>`;
    default: return `${note}<span class="grow"></span>${w.behind ? `<button class="btn solid" data-act="rebase">Rebase 到 main</button>` : ""}${seg}
      <button class="btn primary" data-act="merge">合并到 main</button>`;
  }
}

function renderDetail() {
  const w = WT.find(x => x.id === sel);
  if (!w) { $("detail").innerHTML = `<div class="empty">选择一个 worktree</div>`; return; }
  if (w.status === "behind" && mode === "ff") mode = "squash";
  const st = STATUS[w.status];
  const tabs = [["overview","概览"],["commits","Commits",w.ahead],["files","改动",w.files],["review","审查与检查",w.review ? w.review.findings.length : ""]];
  $("detail").innerHTML = `<div class="dhead">
      <h2>${esc(w.title)}</h2>
      <div class="meta"><span class="status ${st.cls}"><span class="dot"></span>${st.label}</span>
        <span class="mono">${esc(w.branch)} → main</span><span>${w.age}</span>
        ${w.chat ? `<a href="#">打开 chat</a>` : ""}<a href="#">在终端打开</a></div>
      <div class="seg" role="tablist">${tabs.map(([k, l, n]) =>
        `<button role="tab" aria-pressed="${tab === k}" aria-selected="${tab === k}" data-t="${k}">${l}${n !== undefined && n !== "" ? `<b>${n}</b>` : ""}</button>`).join("")}</div>
    </div>
    <div class="pane">${pane(w)}</div>
    <div class="footer">${footer(w)}</div>`;
  const d = $("detail");
  d.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; renderDetail(); });
  d.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { if (b.dataset.m === "ff" && w.behind) return toast("落后 main，先 rebase 才能 fast-forward"); mode = b.dataset.m; renderDetail(); });
  d.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act, w, b));
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
function modal(title, body, okLabel, onOk, danger) {
  $("modal").innerHTML = `<div class="hd" id="mtitle">${title}</div><div class="bd">${body}</div>
    <div class="ft"><button class="btn ghost" id="mcancel">取消</button>
    <button class="btn ${danger ? "danger" : "primary"}" id="mok">${okLabel}</button></div>`;
  $("scrim").classList.add("open"); $("mok").focus();
  const close = () => $("scrim").classList.remove("open");
  $("mcancel").onclick = close;
  $("mok").onclick = () => { close(); onOk(); };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") $("scrim").classList.remove("open"); });

function act(a, w, btn) {
  if (a === "merge") {
    const msg = mode === "squash" ? `${w.title}\n\nSquashed ${w.ahead} commits from ${w.branch}` : "";
    modal(`合并 ${esc(w.branch)} → main`,
      `<div class="kv" style="margin-bottom:12px"><dt>方式</dt><dd>${mode === "squash" ? "Squash 成一个 commit" : "Fast-forward"}</dd>
        <dt>改动</dt><dd><span class="ok">+${w.add}</span> <span class="bad">−${w.del}</span> · ${w.files} 个文件</dd>
        <dt>主 checkout</dt><dd class="ok">在 main 上，干净 · 合并后同步工作区</dd></div>
       ${mode === "squash" ? `<label class="faint" for="cmsg">Commit message</label><textarea id="cmsg">${esc(msg)}</textarea>` : ""}
       <div class="faint" style="margin-top:10px">合并后 worktree 和分支保留，可在"已合并"里删除。</div>`,
      "合并", () => {
        const sha = "f3e1d08";
        MAIN[sha] = mode === "squash" ? w.title : `Merge ${w.branch}`;
        ROWS = ROWS.filter(r => r !== "w:" + w.id); ROWS.unshift("m:" + sha, "w:" + w.id); HEAD = sha;
        Object.assign(w, { status:"merged", mergedAs:sha, merge:sha, ahead:0 }); WT.forEach(x => { if (x !== w && x.status !== "merged") { x.behind++; if (x.status === "ready") x.status = "behind"; } }); toast("已合并为 f3e1d08，其他分支落后 main +1"); render(); });
  } else if (a === "rebase") {
    toast("已 rebase 到 main（无冲突）");
    ROWS = ROWS.filter(r => r !== "w:" + w.id); ROWS.splice(ROWS.indexOf("m:" + HEAD), 0, "w:" + w.id);
    Object.assign(w, { fork:HEAD, behind:0, status:"ready", checks:w.checks && w.checks.map(c => [c[0], "pend", "待重跑"]) }); render();
  } else if (a === "checks") {
    w.checks = [["test","pend","运行中…"],["clippy","pend","运行中…"]]; renderDetail();
    setTimeout(() => { w.checks = [["test","ok","1m 44s"],["clippy","ok","36s"]]; if (w.id === sel) renderDetail(); toast(`${w.branch} 检查通过`); }, 1400);
  } else if (a === "review") {
    if (btn.dataset.p === "custom") return modal("自定义审查", `<label class="faint" for="rp">审查 prompt（diff 会自动附上）</label><textarea id="rp">只看本分支是否引入了新的 unwrap()/expect()，列出位置。</textarea>`, "开始审查", () => toast("已在只读 reviewer chat 中开始审查"));
    btn.textContent = "审查中…"; btn.disabled = true;
    setTimeout(() => { w.review = { by:btn.dataset.p, verdict:"1 个问题", findings:[["低", FILES[0][1].replace("crates/","") + ":42", "错误分支里没有带上冲突路径"]] }; if (w.id === sel) renderDetail(); }, 1200);
  } else if (a === "send") {
    const f = w.review.findings[+btn.dataset.i];
    modal("发回作者 chat", `<div class="faint" style="margin-bottom:6px">会作为一条消息排进「${esc(w.chat)}」的队列：</div>
      <textarea>审查（${esc(w.review.by)}）发现：\n${esc(f[1])} — ${esc(f[2])}\n请修复。</textarea>`, "发送", () => toast(`已排进「${w.chat}」`));
  } else if (a === "resolve") {
    modal("交给 chat 解决冲突", `<textarea>把本分支 rebase 到最新 main，解决这些冲突：\n${w.conflicts.join("\n")}\n解决后跑一遍 cargo test。</textarea>`, "发送", () => { w.status = "running"; w.turn = "正在 rebase"; toast(`已排进「${w.chat}」`); render(); });
  } else if (a === "remove") {
    modal("删除 worktree", `会删除 <span class="mono">${esc(w.path)}</span> 和分支 <span class="mono">${esc(w.branch)}</span>。${w.status === "merged" ? "内容已在 main 中。" : ""}<div class="faint" style="margin-top:8px">对应的 chat 会保留并归档。</div>`,
      "删除", () => { WT.splice(WT.indexOf(w), 1); ROWS = ROWS.filter(r => r !== "w:" + w.id); sel = WT[0] && WT[0].id; toast("已删除"); render(); }, true);
  } else if (a === "commit") {
    modal("提交未提交的改动", `<textarea>wip: hook 实验</textarea><div class="faint" style="margin-top:8px">只在这个 worktree 的分支上提交。</div>`, "提交",
      () => { Object.assign(w, { uncommitted:0, ahead:1, status:"behind" }); toast("已提交"); render(); });
  } else if (a === "editor") toast("已在编辑器打开冲突文件");
}

function render() { $("headsha").textContent = HEAD; renderChips(); renderList(); renderDetail(); }
$("refresh").onclick = () => toast("已 fetch，状态已刷新");
render();
</script>
</body>
</html>
